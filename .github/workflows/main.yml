name: Build ProEdit APK
 
on:
  push:
    branches: [ main ]
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-node@v4
        with:
          node-version: 20
 
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
 
      - name: Sediakan projek Capacitor
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7
          npx cap init "ProEdit" "com.prokuiz.proedit" --web-dir=www
          npx cap add android
 
      - name: Tambah kebenaran mikrofon & storan
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n</manifest>#' $M
          cat $M
 
      - name: Sync
        run: npx cap sync android
 
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
 
      - uses: actions/upload-artifact@v4
        with:
          name: ProEdit-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
 
